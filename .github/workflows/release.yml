name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package version
        run: |
          package_version=$(PYTHONPATH=src python -c 'from bench import __version__; print(__version__)')
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Build release artifacts
        run: |
          python -m pip install build
          python -m build
      - name: Verify the wheel
        run: |
          python -m venv /tmp/agenthangar-evals-release
          /tmp/agenthangar-evals-release/bin/python -m pip install dist/*.whl
          /tmp/agenthangar-evals-release/bin/bench --version
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "AgentHangar Evals ${GITHUB_REF_NAME}"
