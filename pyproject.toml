[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthangar-evals"
version = "1.0.1"
description = "Reproducible private benchmarks for choosing coding-agent configurations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
authors = [{name = "AgentHangar"}]
license = "MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/AgentHangar/evals"
Repository = "https://github.com/AgentHangar/evals"
Issues = "https://github.com/AgentHangar/evals/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
