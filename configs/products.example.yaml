# Snapshot example verified 2026-09-22. These are candidates, not recommendations.
# Re-check model access with your account before a paid matrix. Pin CLI versions,
# effort, tools, network policy and task environment for the whole snapshot.
# Sources:
# https://developers.openai.com/api/docs/models/gpt-6-astra
# https://platform.claude.com/docs/en/models/opus-5-5/overview
# https://platform.claude.com/docs/en/models/fable-5-1/overview
# https://platform.claude.com/docs/en/models/overview
# Claude uses reported API-equivalent USD, not subscription marginal cost.
# Codex rates below are a STANDARD short-context estimate. They do not account
# for cache writes, long-context premiums, Fast mode, tools or subscriptions.
# For those cases omit the rates (unknown cost) or supply a consistent measured
# cost basis; do not interpret the estimate as an invoice or routing guarantee.
incumbent: codex-astra-high
configs:
  - id: codex-astra-high
    harness: codex
    model: gpt-6-astra
    extra_args: ["-c", 'model_reasoning_effort="high"']
    cost:
      mode: per_token
      input_per_mtok: 10.0
      cached_input_per_mtok: 1.0
      output_per_mtok: 50.0
  - id: codex-astra-medium
    harness: codex
    model: gpt-6-astra
    extra_args: ["-c", 'model_reasoning_effort="medium"']
    cost:
      mode: per_token
      input_per_mtok: 10.0
      cached_input_per_mtok: 1.0
      output_per_mtok: 50.0
  - id: claude-opus-5-5-high
    harness: claude-code
    model: claude-opus-5-5
    extra_args: ["--effort", "high"]
    cost:
      mode: harness_reported
  - id: claude-fable-5-1-high
    harness: claude-code
    model: claude-fable-5-1
    extra_args: ["--effort", "high"]
    cost:
      mode: harness_reported
  - id: claude-sonnet-5-high
    harness: claude-code
    model: claude-sonnet-5
    extra_args: ["--effort", "high"]
    cost:
      mode: harness_reported
